<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Управление Нормой СС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #121214);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e24);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      user-select: none;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .info .role {
      font-size: 12px;
      color: var(--hint-color);
      text-transform: uppercase;
      font-weight: 600;
    }
    .info .nick {
      font-size: 15px;
      font-weight: bold;
      margin-top: 2px;
    }
    .status-btn {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
    }
    .btn-norma { background: #28a745; }
    .btn-overnorma { background: #007bff; }
    .btn-natyag { background: #6f42c1; }
    .btn-nonorma { background: #dc3545; }
    .btn-neaktiv { background: #6c757d; }
    .btn-close {
      grid-column: span 2;
      background: #343a40;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>⚡ Старший Состав [А-ОПГ]</h2>
  <div class="grid" id="members-list">
    <!-- Список генерируется через app.js -->
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="action-btn btn-norma" onclick="sendAction('norma')">🟩 Норма (+5)</button>
      <button class="action-btn btn-overnorma" onclick="sendAction('overnorma')">🟦 Перенорма (+8)</button>
      <button class="action-btn btn-natyag" onclick="sendAction('natyag')">🟪 Натяг (+1)</button>
      <button class="action-btn btn-nonorma" onclick="sendAction('nonorma')">🟥 Нет нормы (-5)</button>
      <button class="action-btn btn-neaktiv" onclick="sendAction('neaktiv')">⬜ Неактив (-2)</button>
      <button class="action-btn btn-close" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
